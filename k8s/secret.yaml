# ==============================================================================
# MediFlow Kubernetes Manifest: Secret Template
# Role: Kubernetes Engineer (TASK-K8S-01)
# NOTE: Do NOT commit real production credentials to version control.
# Base64 encoded or stringData template for staging / production deployment.
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mediflow-secret
  namespace: mediflow
  labels:
    app.kubernetes.io/name: mediflow
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: mediflow-system
type: Opaque
stringData:
  # Replace with actual MongoDB Atlas URI during CI/CD injection or via vault/sealed-secrets
  MONGODB_URI: "mongodb+srv://mediflow_user:StrongPassword123@cluster0.example.mongodb.net/mediflow?retryWrites=true&w=majority"
  # Minimum 32-character secure secret for Auth.js cryptographic token signing
  NEXTAUTH_SECRET: "mediflow_production_jwt_session_secret_min_32_chars_key_token!"
