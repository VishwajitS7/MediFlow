apiVersion: v1
kind: Service
metadata:
  name: mediflow-service
  namespace: mediflow
  labels:
    app.kubernetes.io/name: mediflow
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: mediflow-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mediflow
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
