# ==============================================================================
# MediFlow Kubernetes Manifest: ConfigMap
# Role: Kubernetes Engineer (TASK-K8S-01)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediflow-config
  namespace: mediflow
  labels:
    app.kubernetes.io/name: mediflow
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: mediflow-system
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"
  NEXTAUTH_URL: "http://mediflow.local"
  CLINIC_TIMEZONE: "Asia/Kolkata"
