# ==============================================================================
# MediFlow Kubernetes Kustomization
# Role: Kubernetes Engineer (TASK-K8S-01)
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mediflow

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mediflow-system
      app.kubernetes.io/managed-by: kustomize

