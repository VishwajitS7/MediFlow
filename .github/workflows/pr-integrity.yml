name: PR Integrity & Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    env:
      NEXTAUTH_SECRET: ci-mock-secret-key-32-bytes-long!
      NEXTAUTH_URL: http://localhost:3000
      MONGODB_URI: mongodb://localhost:27017/mediflow-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint Code Verification
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Execute Vitest Suite
        run: npm test

      - name: Validate Production Build
        run: npm run build
